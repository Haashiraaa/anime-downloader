
name: Changelog

# Fires right after release.yml successfully publishes a GitHub Release.
# Takes the auto-generated release notes and prepends them to CHANGELOG.md.
on:
  release:
    types: [published]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepend release notes to CHANGELOG.md
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          {
            echo "## [$TAG] - $DATE"
            echo ""
            echo "$BODY"
            echo ""
          } > /tmp/new_entry.md

          if [ -f CHANGELOG.md ]; then
            # Drop the existing "# Changelog" title line, keep the rest
            tail -n +2 CHANGELOG.md > /tmp/rest.md || true
          else
            : > /tmp/rest.md
          fi

          {
            echo "# Changelog"
            echo ""
            cat /tmp/new_entry.md
            cat /tmp/rest.md
          } > CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "docs: update changelog for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
